plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.matheus.firelitelauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.matheus.firelitelauncher'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
